version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    env_file: .env ## Change this file for customized env variables
    networks:
      - upperfy-net
    volumes:
      - chatwoot_data:/app/storage
      - chatwoot_data_public:/app
  rails:
    <<: *base
    depends_on:
      - postgres
    networks:
      - upperfy-net
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: ./docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
    networks:
      - upperfy-net
    volumes:
      - chatwoot_data:/app/storage
      - chatwoot_data_public:/app      
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    networks:
      - upperfy-net
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      # Please provide your own password.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  adminer:
    image: adminer:latest
    networks:
      - upperfy-net
    container_name: up-chat_adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
  redis:
    image: redis:6.2-alpine
    container_name: redis
    networks:
      - upperfy-net
    ports:
      - ${REDIS_PORT}:6379
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis-data:/data
volumes:
  # storage_data:
  redis-data:
  postgres_data:
  chatwoot_data:
  chatwoot_data_public:

networks:
  upperfy-net:
    driver: bridge
    name: upperfy-net
